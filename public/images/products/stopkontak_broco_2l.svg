<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgSK" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="plateSK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="socketCup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <filter id="skShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgSK)"/>
  
  <!-- Outer Plate -->
  <rect x="65" y="100" width="370" height="300" rx="30" fill="url(#plateSK)" stroke="#cbd5e1" stroke-width="2" filter="url(#skShadow)"/>
  
  <!-- Left Socket -->
  <g transform="translate(160, 240)">
    <circle cx="0" cy="0" r="62" fill="url(#socketCup)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Earth clips (Arde) Top & Bottom -->
    <rect x="-6" y="-52" width="12" height="14" rx="2" fill="#d97706"/>
    <rect x="-6" y="38" width="12" height="14" rx="2" fill="#d97706"/>
    <!-- Pin holes -->
    <ellipse cx="-20" cy="0" rx="6.5" ry="5.5" fill="#1e293b"/>
    <ellipse cx="20" cy="0" rx="6.5" ry="5.5" fill="#1e293b"/>
    <!-- Center Screw -->
    <circle cx="0" cy="0" r="4.5" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <line x1="-3" y1="0" x2="3" y2="0" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Right Socket -->
  <g transform="translate(340, 240)">
    <circle cx="0" cy="0" r="62" fill="url(#socketCup)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Earth clips (Arde) -->
    <rect x="-6" y="-52" width="12" height="14" rx="2" fill="#d97706"/>
    <rect x="-6" y="38" width="12" height="14" rx="2" fill="#d97706"/>
    <!-- Pin holes -->
    <ellipse cx="-20" cy="0" rx="6.5" ry="5.5" fill="#1e293b"/>
    <ellipse cx="20" cy="0" rx="6.5" ry="5.5" fill="#1e293b"/>
    <!-- Center Screw -->
    <circle cx="0" cy="0" r="4.5" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <line x1="-3" y1="0" x2="3" y2="0" stroke="#475569" stroke-width="1.5"/>
  </g>

  <text x="250" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="2">BROCO</text>
  <text x="250" y="375" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">16A 250V~ DOUBLE SOCKET ARDE</text>
</svg>