<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgP6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="metalBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="acrylicDoor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgP6)"/>
  
  <!-- Outer Steel Box Frame -->
  <rect x="100" y="80" width="300" height="340" rx="16" fill="url(#metalBox)" stroke="#334155" stroke-width="3" filter="url(#panelShadow)"/>
  
  <!-- Recessed Interior with DIN Rail -->
  <rect x="125" y="110" width="250" height="280" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="135" y="210" width="230" height="20" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  
  <!-- 6 MCB Slots Drawn inside -->
  <g transform="translate(145, 160)">
    <rect x="0" y="0" width="32" height="120" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="8" y="50" width="16" height="20" rx="2" fill="#f97316"/>
    
    <rect x="36" y="0" width="32" height="120" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="44" y="50" width="16" height="20" rx="2" fill="#f97316"/>
    
    <rect x="72" y="0" width="32" height="120" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="80" y="50" width="16" height="20" rx="2" fill="#f97316"/>
    
    <rect x="108" y="0" width="32" height="120" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="144" y="0" width="32" height="120" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="180" y="0" width="32" height="120" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
  </g>

  <!-- Smoked Transparent Front Door -->
  <rect x="120" y="105" width="260" height="290" rx="12" fill="url(#acrylicDoor)" stroke="#7dd3fc" stroke-width="2"/>
  
  <!-- Push-to-Open Door Latch -->
  <circle cx="360" cy="250" r="10" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>

  <!-- Warning Label -->
  <polygon points="250,330 238,350 262,350" fill="#eab308"/>
  <text x="250" y="347" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">!</text>
  <text x="250" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">PANEL BOX 6 GROUP</text>
</svg>