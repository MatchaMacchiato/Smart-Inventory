<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgTie" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="tieShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgTie)"/>
  
  <g filter="url(#tieShadow)" transform="rotate(45 250 250)">
    <!-- Bundle of 5 Ties -->
    <g opacity="0.6">
      <rect x="235" y="60" width="10" height="380" rx="3" fill="#e2e8f0"/>
      <rect x="230" y="60" width="20" height="24" rx="4" fill="#cbd5e1"/>
    </g>
    <g opacity="0.8">
      <rect x="245" y="55" width="10" height="380" rx="3" fill="#f1f5f9"/>
      <rect x="240" y="55" width="20" height="24" rx="4" fill="#e2e8f0"/>
    </g>
    <!-- Foreground Single Tie -->
    <rect x="255" y="50" width="12" height="390" rx="4" fill="url(#tieGrad)" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Ratchet Head with Locking Pawl -->
    <rect x="248" y="45" width="26" height="28" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="254" y="52" width="14" height="14" rx="2" fill="#0f172a"/>
    <rect x="257" y="54" width="8" height="10" rx="1" fill="#e2e8f0"/>
    
    <!-- Teeth Serrations along the strap -->
    <line x1="258" y1="90" x2="264" y2="90" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="110" x2="264" y2="110" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="130" x2="264" y2="130" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="150" x2="264" y2="150" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="170" x2="264" y2="170" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="190" x2="264" y2="190" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="210" x2="264" y2="210" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="230" x2="264" y2="230" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="250" x2="264" y2="250" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="270" x2="264" y2="270" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="290" x2="264" y2="290" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="310" x2="264" y2="310" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="330" x2="264" y2="330" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="350" x2="264" y2="350" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="370" x2="264" y2="370" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="390" x2="264" y2="390" stroke="#94a3b8" stroke-width="1"/>
    <line x1="258" y1="410" x2="264" y2="410" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Clear Package Label -->
  <rect x="80" y="370" width="160" height="60" rx="10" fill="#0f172a" fill-opacity="0.85"/>
  <text x="160" y="395" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">KABEL TIES 20 CM</text>
  <text x="160" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Isi: 100 Pcs · Nylon 66</text>
</svg>