<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgStk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="plugBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="brassPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="plugShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgStk)"/>
  
  <!-- Cable Entry at Top -->
  <path d="M 230,60 L 270,60 L 265,130 L 235,130 Z" fill="#94a3b8"/>
  <rect x="225" y="110" width="50" height="25" rx="6" fill="#cbd5e1"/>

  <!-- Main Round Plug Body -->
  <g filter="url(#plugShadow)">
    <circle cx="250" cy="250" r="110" fill="url(#plugBody)" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Grip Grooves on Sides -->
    <path d="M 148,220 C 145,250 145,260 148,280" stroke="#94a3b8" stroke-width="3" fill="none"/>
    <path d="M 352,220 C 355,250 355,260 352,280" stroke="#94a3b8" stroke-width="3" fill="none"/>
    
    <!-- Earthing Ground Strips (Arde) -->
    <rect x="242" y="145" width="16" height="28" rx="2" fill="url(#brassPin)"/>
    <rect x="242" y="327" width="16" height="28" rx="2" fill="url(#brassPin)"/>
    
    <!-- Center Screw -->
    <circle cx="250" cy="250" r="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <line x1="244" y1="250" x2="256" y2="250" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Two Brass Pins Sticking Out (bottom perspective) -->
  <g transform="translate(0, 50)">
    <rect x="200" y="330" width="22" height="60" rx="6" fill="url(#brassPin)" stroke="#854d0e" stroke-width="1"/>
    <rect x="278" y="330" width="22" height="60" rx="6" fill="url(#brassPin)" stroke="#854d0e" stroke-width="1"/>
  </g>

  <text x="250" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="2">BROCO</text>
  <text x="250" y="295" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">16A 250V~ STEKER ARDE</text>
</svg>