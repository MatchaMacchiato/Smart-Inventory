<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgUt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="bodyUt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="utShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgUt)"/>
  
  <!-- Multi-Tap Extension Block -->
  <rect x="60" y="120" width="380" height="260" rx="24" fill="url(#bodyUt)" stroke="#cbd5e1" stroke-width="2" filter="url(#utShadow)"/>
  
  <!-- Illuminated Red Switch -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="45" height="70" rx="8" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
    <rect x="8" y="10" width="29" height="22" rx="4" fill="#f87171"/>
    <text x="22" y="26" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">I</text>
    <text x="22" y="56" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fecaca" text-anchor="middle">O</text>
  </g>

  <!-- Socket 1 -->
  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="-4" y="-35" width="8" height="10" rx="2" fill="#d97706"/>
    <rect x="-4" y="25" width="8" height="10" rx="2" fill="#d97706"/>
    <ellipse cx="-13" cy="0" rx="5" ry="4" fill="#1e293b"/>
    <ellipse cx="13" cy="0" rx="5" ry="4" fill="#1e293b"/>
  </g>

  <!-- Socket 2 -->
  <g transform="translate(300, 200)">
    <circle cx="0" cy="0" r="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="-4" y="-35" width="8" height="10" rx="2" fill="#d97706"/>
    <rect x="-4" y="25" width="8" height="10" rx="2" fill="#d97706"/>
    <ellipse cx="-13" cy="0" rx="5" ry="4" fill="#1e293b"/>
    <ellipse cx="13" cy="0" rx="5" ry="4" fill="#1e293b"/>
  </g>

  <!-- Socket 3 -->
  <g transform="translate(200, 300)">
    <circle cx="0" cy="0" r="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="-4" y="-35" width="8" height="10" rx="2" fill="#d97706"/>
    <rect x="-4" y="25" width="8" height="10" rx="2" fill="#d97706"/>
    <ellipse cx="-13" cy="0" rx="5" ry="4" fill="#1e293b"/>
    <ellipse cx="13" cy="0" rx="5" ry="4" fill="#1e293b"/>
  </g>

  <!-- Socket 4 -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="-4" y="-35" width="8" height="10" rx="2" fill="#d97706"/>
    <rect x="-4" y="25" width="8" height="10" rx="2" fill="#d97706"/>
    <ellipse cx="-13" cy="0" rx="5" ry="4" fill="#1e293b"/>
    <ellipse cx="13" cy="0" rx="5" ry="4" fill="#1e293b"/>
  </g>

  <!-- Branding -->
  <text x="390" y="255" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1">UTICON</text>
  <text x="390" y="275" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">4-LUBANG</text>
</svg>